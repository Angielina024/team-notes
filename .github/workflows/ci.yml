name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: app   # усі команди — у теці app/

jobs:
  fast:
    name: Types, layers, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:layers
      - run: npm run test:unit

  db-and-e2e:
    name: Integration and e2e tests
    needs: fast              # стартує, лише якщо fast зелений
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: team_notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d team_notes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/team_notes_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/team_notes_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Apply migrations to a clean database
        run: npx tsx scripts/migrate.ts
      - run: npm run test:integration
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
